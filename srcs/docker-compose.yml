name: ${COMPOSE_PROJECT_NAME:-inception}

services:
  mariadb:
    image: mariadb:inception
    pull_policy: never
    build: ./requirements/mariadb
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME:?Run make setup}
      DB_USER: ${DB_USER:?Run make setup}
    secrets:
      - db_root_password
      - db_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks: [inception]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, /usr/local/bin/db-healthcheck]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 40s

  wordpress:
    image: wordpress:inception
    pull_policy: never
    build: ./requirements/wordpress
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Run make setup}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      DB_NAME: ${DB_NAME:?Run make setup}
      DB_USER: ${DB_USER:?Run make setup}
      WP_TITLE: ${WP_TITLE:?Run make setup}
      WP_ADMIN_USER: ${WP_ADMIN_USER:?Run make setup}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?Run make setup}
      WP_USER: ${WP_USER:?Run make setup}
      WP_USER_EMAIL: ${WP_USER_EMAIL:?Run make setup}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks: [inception]
    security_opt: [no-new-privileges:true]
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, /usr/local/bin/wp-healthcheck]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 60s

  nginx:
    image: nginx:inception
    pull_policy: never
    build: ./requirements/nginx
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
      static_site:
        condition: service_healthy
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Run make setup}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks: [inception]
    security_opt: [no-new-privileges:true]
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, 'curl -fkSs --noproxy "*" --resolve "$${DOMAIN_NAME}:443:127.0.0.1" "https://$${DOMAIN_NAME}/healthz" >/dev/null']
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 10s

  static_site:
    image: static_site:inception
    pull_policy: never
    build: ./requirements/bonus/static_site
    restart: unless-stopped
    # Tiny init forwards stop signals and reaps children for BusyBox's HTTP server.
    init: true
    read_only: true
    cap_drop: [ALL]
    networks: [inception]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, busybox, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 4s
      retries: 6

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    name: ${VOLUME_PREFIX:-}mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:?Run make setup}/mariadb
  wordpress_data:
    name: ${VOLUME_PREFIX:-}wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:?Run make setup}/wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
